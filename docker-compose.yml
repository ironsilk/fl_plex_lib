version: '2.1'
services:
  db_builder:
    container_name: db_builder
    network_mode: host
    build:
      context: ./
      dockerfile: Dockerfile_db_builder
    env_file:
      - .env
    # unless-stopped (not on-failure): this is a long-running scheduler and on-failure does not
    # bring it back after a clean host reboot, which is how it stayed dead for two weeks.
    restart: unless-stopped
    volumes:
      - ${PLEX_MOVIES_LIBRARY_FOLDER}:${PLEX_MOVIES_LIBRARY_FOLDER_MAP}